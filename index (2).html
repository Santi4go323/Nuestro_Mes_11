<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Felices 11 meses, mi amor bello</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fbe8ec;--bg2:#eeb9c6;--text:#5b1f33;--rose:#b3304f;--wine:#6b1730;--gold:#b8924a;--paper:#fffaf2;--paper2:#fbeee6;--soft:#8c4a5e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#4a1426;--bg2:#1d0910;--text:#fbe3e8;--soft:#e3a9b8;--gold:#d9b46a;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#4a1426;--bg2:#1d0910;--text:#fbe3e8;--soft:#e3a9b8;--gold:#d9b46a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 20%,var(--bg1),var(--bg2));color:var(--text);font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-style:italic;font-weight:500;display:flex;align-items:center;justify-content:center;padding:28px 14px;overflow-x:hidden}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.petals i{position:absolute;top:-40px;border-radius:150% 0 150% 0;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,-40px) rotate(0)}50%{transform:translate(var(--dx),55vh) rotate(200deg)}100%{transform:translate(calc(var(--dx)*-.6),115vh) rotate(420deg)}}
.petals b{position:absolute;font-weight:400;font-style:normal;color:#fff3c9;text-shadow:0 0 6px #e8c26a,0 0 12px #d9a441,0 0 3px #b8924a;animation:tw ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.screen{display:none;width:100%;max-width:460px;text-align:center;position:relative;z-index:1}
.screen.on{display:block;animation:in 1s ease both}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
h1{font-family:'Great Vibes','Snell Roundhand',cursive;font-weight:400;font-size:3.1rem;line-height:1.15;margin:.1em 0 .25em;color:var(--rose);text-shadow:0 2px 14px rgba(179,48,79,.25)}
.sub{color:var(--soft);font-size:1.3rem;margin:.3em 0}
/* papel */
.paper{position:relative;background:radial-gradient(ellipse at 50% 0,var(--paper),var(--paper2));color:var(--wine);text-align:left;font-size:1.42rem;line-height:1.7;padding:44px 36px 36px;border-radius:4px;border:1px solid var(--gold);box-shadow:0 18px 44px rgba(107,23,48,.3),inset 0 0 60px rgba(214,150,120,.18)}
.paper::before{content:"";position:absolute;inset:9px;border:1px solid var(--gold);opacity:.7;pointer-events:none}
.paper p{margin:0 0 1em}
.c{position:absolute;width:38px;height:38px;color:var(--gold)}
.c.tl{top:6px;left:6px}.c.tr{top:6px;right:6px;transform:scaleX(-1)}.c.bl{bottom:6px;left:6px;transform:scaleY(-1)}.c.br{bottom:6px;right:6px;transform:scale(-1)}
.to{font-family:'Great Vibes',cursive;font-style:normal;font-size:2.4rem;line-height:1.2;color:var(--rose);margin:0 0 .4em!important}
#letter p:first-child::first-letter{font-family:'Great Vibes',cursive;font-style:normal;font-size:3.4rem;line-height:.8;float:left;padding:6px 8px 0 0;color:var(--rose)}
.sign{font-family:'Great Vibes',cursive;font-style:normal;font-size:2.5rem;text-align:right;color:var(--rose);margin:.3em 0 0!important}
.div{display:flex;align-items:center;gap:10px;color:var(--rose);margin:4px 0 14px;font-style:normal}
.div::before,.div::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.rise{opacity:0;animation:rise .9s ease forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* botones */
.btn{display:inline-block;margin-top:24px;padding:12px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#cf4a6a,var(--wine));color:#fff4ee;font:inherit;font-size:1.3rem;cursor:pointer;text-decoration:none;box-shadow:0 8px 22px rgba(107,23,48,.4);transition:transform .2s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--gold);box-shadow:none}
.btn:disabled{opacity:.3}
/* sobre */
.env{position:relative;width:280px;height:190px;margin:40px auto 30px;cursor:pointer;perspective:900px}
.eb{position:absolute;inset:0;background:linear-gradient(160deg,#fffaf2,#f3d5d3);border-radius:4px;box-shadow:0 16px 36px rgba(107,23,48,.35)}
.peek{position:absolute;left:14px;right:14px;top:18px;bottom:6px;background:var(--paper);border:1px solid var(--gold);transition:transform 1s ease .5s;z-index:1}
.front{position:absolute;inset:0;z-index:2;border-radius:4px;background:linear-gradient(to top right,transparent 49.6%,rgba(179,48,79,.22) 50%) left/50% 100% no-repeat,linear-gradient(to top left,transparent 49.6%,rgba(179,48,79,.22) 50%) right/50% 100% no-repeat,linear-gradient(#f9e1e1,#f3d0d3) bottom/100% 52% no-repeat;clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%)}
.flap{position:absolute;left:0;right:0;top:0;height:112px;z-index:3;background:linear-gradient(#f6d3d6,#efbfc6);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s ease}
.seal{position:absolute;z-index:4;left:50%;top:84px;margin-left:-26px;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d4405f,#7d1229);color:#ffdfe4;font-style:normal;font-size:1.7rem;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.45),inset 0 0 0 3px rgba(255,255,255,.15);animation:beat 1.8s infinite;transition:opacity .4s}
@keyframes beat{50%{transform:scale(1.1)}}
.env.open .flap{transform:rotateX(180deg)}
.env.open .peek{transform:translateY(-64px)}
.env.open .seal{opacity:0;animation:none}
.polaroid{position:relative;width:80%;margin:8px auto 26px;background:#fffdf8;padding:10px 10px 8px;border:1px solid var(--gold);box-shadow:0 12px 26px rgba(107,23,48,.3);--rot:-2.5deg;transform:rotate(var(--rot));text-align:center;animation:pol 1s ease .3s both}
.polaroid::before{content:"";position:absolute;top:-13px;left:50%;width:84px;height:24px;margin-left:-42px;background:rgba(214,170,120,.55);transform:rotate(3deg)}
.polaroid img{width:100%;display:block;aspect-ratio:4/5;object-fit:cover;object-position:50% 40%}
.polaroid span{display:block;font-family:'Great Vibes',cursive;font-style:normal;font-size:1.9rem;line-height:1.5;color:var(--rose)}
/* libro */
.page{min-height:380px;display:flex;flex-direction:column;justify-content:center;font-size:1.5rem}
.page p{text-align:center}
.flip{transform-origin:left center;animation:flip 1.2s ease both}
@keyframes flip{from{opacity:0;transform:perspective(1000px) rotateY(-30deg)}to{opacity:1;transform:none}}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.nav .btn{margin:18px 0 0;padding:9px 20px}
.dots{display:flex;gap:7px;margin-top:18px}
.dots b{width:8px;height:8px;border-radius:50%;background:var(--gold);opacity:.35;transition:.3s}
.dots b.on{opacity:1;background:var(--rose);transform:scale(1.3)}
#mus{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));width:42px;height:42px;border-radius:50%;border:1px solid var(--gold);background:rgba(255,250,242,.85);color:var(--rose);font-size:1.4rem;line-height:1;cursor:pointer;z-index:10;display:none;box-shadow:0 4px 12px rgba(107,23,48,.25)}
#mus.on{display:block}
#toBook{opacity:0;pointer-events:none;transition:opacity 1.2s}
#toBook.show{opacity:1;pointer-events:auto}
.sign{opacity:0;transition:opacity 1.4s}
.done .sign,.done .days{opacity:1}
.days{opacity:0;transition:opacity 1.6s .6s;text-align:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--gold);font-size:1.2rem;line-height:1.3}
.days b{display:block;font-family:'Great Vibes',cursive;font-style:normal;font-weight:400;font-size:3.4rem;line-height:1.1;color:var(--rose)}
.polaroid.mini{width:62%;margin:2px auto 20px}
.polaroid.mini img{aspect-ratio:auto;height:auto}
@keyframes pol{from{opacity:0;transform:translateY(12px) rotate(var(--rot))}to{opacity:1;transform:rotate(var(--rot))}}
#mus.off{opacity:.6}
#mus.off::after{content:"";position:absolute;left:10px;right:10px;top:50%;height:2px;background:var(--rose);transform:rotate(-45deg)}
/* canción */
.eq{display:flex;gap:5px;justify-content:center;align-items:flex-end;height:46px;margin:8px 0 18px}
.eq i{width:6px;border-radius:3px;background:linear-gradient(var(--rose),var(--gold));animation:eq 1.1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.45s}.eq i:nth-child(4){animation-delay:.1s}.eq i:nth-child(5){animation-delay:.35s}
@keyframes eq{0%,100%{height:10px}50%{height:44px}}
.big{font-family:'Great Vibes',cursive;font-style:normal;font-size:2.2rem;text-align:center;color:var(--rose);margin:.2em 0 0!important}
</style>
</head>

/* ====================================== */

const $=id=>document.getElementById(id);
const show=n=>{document.querySelectorAll('.screen').forEach((s,k)=>s.classList.toggle('on',k===n));window.scrollTo(0,0)};
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const dress=el=>['tl','tr','bl','br'].forEach(c=>el.insertAdjacentHTML('beforeend','<svg class="c '+c+'"><use href="#corner"/></svg>'));
document.querySelectorAll('.paper').forEach(dress);

$('to').textContent=DATA.para;
$('from').textContent=DATA.de;
$('letter').innerHTML=DATA.carta.map(p=>'<p>'+esc(p)+'</p>').join('');
$('bookTitle').textContent=DATA.libroTitulo;
$('songMsg').textContent=DATA.cancionMsg;
$('songLink').href=DATA.linkVideo;
$('dots').innerHTML=DATA.paginas.map(()=>'<b></b>').join('');

let i=0;
function render(){
  flip();
  const pg=$('pg');
  pg.querySelectorAll('.pc').forEach(n=>n.remove());
  const ph=DATA.fotos[i]?'<div class="polaroid mini" style="--rot:'+(i%2?'2.2deg':'-2.2deg')+'"><img alt="" src="'+DATA.fotos[i]+'"><span>♥</span></div>':'';
  pg.insertAdjacentHTML('afterbegin','<div class="pc"><div class="div">♥</div>'+ph+'<p style="margin:0">'+esc(DATA.paginas[i])+'</p><div class="div" style="margin:14px 0 0">'+(i+1)+'</div></div>');
  pg.classList.remove('flip');void pg.offsetWidth;pg.classList.add('flip');
  document.querySelectorAll('#dots b').forEach((b,k)=>b.classList.toggle('on',k===i));
  $('prev').disabled=i===0;
  $('next').textContent=i===DATA.paginas.length-1?'Final ♥':'→';
}
const daysTogether=()=>Math.max(0,Math.floor((Date.now()-new Date(DATA.inicio+'T00:00:00'))/864e5));
let typing,finished=true;
function finish(){
  clearTimeout(typing);if(finished)return;finished=true;
  document.querySelectorAll('#letter p').forEach((p,k)=>{p.textContent=DATA.carta[k]});
  $('lp').classList.add('done');$('hint').style.display='none';$('toBook').classList.add('show');
  const n=daysTogether(),st=Math.max(1,Math.ceil(n/50));let v=0;
  const iv=setInterval(()=>{v=Math.min(n,v+st);$('dn').textContent=v;if(v>=n)clearInterval(iv)},40);
}
function typeLetter(){
  clearTimeout(typing);finished=false;
  $('lp').classList.remove('done');$('toBook').classList.remove('show');$('hint').style.display='';$('dn').textContent='0';
  const ps=[...document.querySelectorAll('#letter p')];
  ps.forEach((p,k)=>{p.innerHTML='<span></span><span style="visibility:hidden"></span>';p.lastChild.textContent=DATA.carta[k]});
  let pi=0,ci=0;
  (function tick(){
    if(finished)return;
    if(pi>=ps.length){finish();return}
    const t=DATA.carta[pi],p=ps[pi];ci++;
    p.firstChild.textContent=t.slice(0,ci);p.lastChild.textContent=t.slice(ci);
    if(ci>=t.length){pi++;ci=0;typing=setTimeout(tick,700)}
    else typing=setTimeout(tick,/[.,;]/.test(t[ci-1])?170:22);
  })();
}
$('lp').onclick=finish;
$('env').onclick=()=>{$('env').classList.add('open');play();setTimeout(()=>{show(1);typeLetter()},1900)};
$('toBook').onclick=()=>{i=0;render();show(2)};
$('prev').onclick=()=>{if(i>0){i--;render()}};
$('next').onclick=()=>{if(i<DATA.paginas.length-1){i++;render()}else{flip();show(3)}};
$('again').onclick=()=>{$('env').classList.remove('open');show(0)};

/* ====== MÚSICA SUAVE (generada, sin archivos) ====== */
let AC,master,timer,playing=false,step=0,nextT=0;
const NF=m=>440*Math.pow(2,(m-69)/12);
const CH=[[48,55,59,64],[45,52,57,60],[41,48,52,57],[43,50,55,59]];
const MEL=[[76,0,0,79],[72,0,76,0],[77,0,0,72],[74,0,79,0]];
function tone(f,t,d,v,at){
  [0,4].forEach(dt=>{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';o.frequency.value=f;o.detune.value=dt;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.1);
  });
}
function sched(){
  while(nextT<AC.currentTime+1.2){
    const b=Math.floor(step/4)%4,k=step%4,c=CH[b];
    if(k===0)c.forEach(n=>tone(NF(n),nextT,7,.05,1.8));
    const m=MEL[b][k];if(m)tone(NF(m),nextT,4.5,.05,.08);
    nextT+=1.5;step++;
  }
}
function play(){
  try{
    if(!AC){
      AC=new (window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain();master.gain.value=0;
      const dl=AC.createDelay(1),fb=AC.createGain(),lp=AC.createBiquadFilter();
      dl.delayTime.value=.6;fb.gain.value=.5;lp.type='lowpass';lp.frequency.value=1500;
      master.connect(AC.destination);master.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(lp);lp.connect(AC.destination);
    }
    AC.resume();
    clearInterval(timer);
    nextT=AC.currentTime+.15;sched();timer=setInterval(sched,250);
    master.gain.cancelScheduledValues(AC.currentTime);
    master.gain.setValueAtTime(master.gain.value,AC.currentTime);
    master.gain.linearRampToValueAtTime(.55,AC.currentTime+3);
    playing=true;$('mus').classList.add('on');$('mus').classList.remove('off');
  }catch(e){}
}
function pause(){
  if(!AC||!playing)return;
  playing=false;$('mus').classList.add('off');
  master.gain.cancelScheduledValues(AC.currentTime);
  master.gain.setValueAtTime(master.gain.value,AC.currentTime);
  master.gain.linearRampToValueAtTime(0,AC.currentTime+.8);
  setTimeout(()=>{if(!playing)clearInterval(timer)},900);
}
function flip(){
  if(!AC||!playing)return;
  try{
    const t=AC.currentTime,len=1.1,buf=AC.createBuffer(1,Math.floor(AC.sampleRate*len),AC.sampleRate),d=buf.getChannelData(0);
    for(let k=0;k<d.length;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/d.length,1.6);
    const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
    s.buffer=buf;f.type='bandpass';f.Q.value=.5;
    f.frequency.setValueAtTime(450,t);f.frequency.exponentialRampToValueAtTime(1700,t+len);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.35);g.gain.exponentialRampToValueAtTime(.001,t+len);
    s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);
  }catch(e){}
}
$('mus').onclick=()=>playing?pause():play();
$('songLink').onclick=pause;
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else if(playing)AC.resume()});

const P=$('petals'),R=Math.random,cols=[['#f8b4c3','#e0607c'],['#ffd0da','#f08aa2'],['#f59ab0','#c2415d'],['#ffe1e6','#f4a3b5']];
for(let k=0;k<14;k++){
  const s=document.createElement('i'),w=6+R()*6,c=cols[k%4];
  s.style.cssText='left:'+R()*100+'%;width:'+w+'px;height:'+w*1.3+'px;opacity:'+(.35+R()*.25)+';background:linear-gradient(135deg,'+c[0]+','+c[1]+');animation-duration:'+(12+R()*10)+'s;animation-delay:'+(-R()*20)+'s;--dx:'+(R()*80-40)+'px';
  P.appendChild(s);
}
</script>
